name: Bundles Builder

on:
  # Create bundle from manual action
  workflow_dispatch:
    inputs:
      gh_ref:
        description: 'Name of the branch or ref'
        type: string
        required: true
        default: 'develop'
      force:
        description: 'Rebuild and overwrite even if this version already exists in S3'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      gh_ref:
        description: 'Name of the branch or ref'
        type: string
        required: true
      force:
        description: 'Rebuild and overwrite even if this version already exists in S3'
        type: boolean
        required: false
        default: false
    outputs:
      sha:
        description: 'Bundled commit, full 40-char SHA.'
        value: ${{ jobs.check.outputs.sha }}
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_REGION:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      MATTERMOST_WEBHOOK:
        required: false
      S3_BUCKET:
        required: false

# Literal group name: under `workflow_call`, `github.workflow` resolves to the
# caller's workflow, which put this workflow and the other reusable one called
# by the same caller into a single shared group, and left a manual dispatch of
# the same ref in a group of its own, free to race on the same artifacts.
concurrency:
  group: build-bundle-${{ inputs.gh_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. Decide whether there is anything to build ───────────────────────
  check:
    name: Check current bundle
    runs-on: penpot-standar-runner
    timeout-minutes: 10
    outputs:
      gh_ref: ${{ steps.vars.outputs.gh_ref }}
      bundle_version: ${{ steps.vars.outputs.bundle_version }}
      build_key: ${{ steps.vars.outputs.build_key }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      sha: ${{ steps.vars.outputs.sha }}
      commit_title: ${{ steps.vars.outputs.commit_title }}
      exists: ${{ steps.check.outputs.exists }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.gh_ref }}

      - name: Extract some useful variables
        id: vars
        env:
          GH_REF: ${{ inputs.gh_ref || github.ref_name }}
        run: |
          # Same command the build uses to stamp version.txt.
          BUNDLE_VERSION=$(./manage.sh version)
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          # The key takes only the closest tag (--abbrev=0): the sha already
          # pins the commit, and the full describe output is not stable
          # across checkouts (its -g<sha> suffix length depends on the
          # local object count). Must match build-docker.yml.
          VERSION_TAG=$(git describe --tags --match '*.*.*' --abbrev=0)
          echo "gh_ref=$GH_REF" >> $GITHUB_OUTPUT
          echo "bundle_version=$BUNDLE_VERSION" >> $GITHUB_OUTPUT
          echo "build_key=sha-${SHORT_SHA}-${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "commit_title=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      # Keyed by commit sha AND version, same as build-docker.yml's marker
      # check, so both pipelines agree on what "already built" means. The
      # version is stamped into the bundle, so a new tag on an already
      # bundled commit (2.18.1-RC1 -> 2.18.1) must produce a new bundle.
      # `force` bypasses this check entirely.
      - name: Check if this bundle is already built
        id: check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          FORCE: ${{ inputs.force }}
          BUILD_KEY: ${{ steps.vars.outputs.build_key }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            {
              echo "### 🔁 Bundle build forced"
              echo ""
              echo "\`force: true\` — skipping the S3 sha check."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BUNDLE_EXISTS=$(aws s3api head-object \
            --bucket "$S3_BUCKET" \
            --key "penpot-${BUILD_KEY}.zip" \
            > /dev/null 2>&1 && echo "true" || echo "false")

          if [ "$BUNDLE_EXISTS" = "true" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            {
              echo "### ⏭️ Bundle build skipped"
              echo ""
              echo "The bundle in S3 was already built for \`${BUILD_KEY}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  # ── 2. Build and upload, only when needed ──────────────────────────────
  build:
    name: Build and Upload Penpot Bundle
    runs-on: penpot-standar-runner
    timeout-minutes: 90
    needs: check
    if: needs.check.outputs.exists == 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.gh_ref }}

      - name: Build bundle
        env:
          BUILD_WASM: 'yes'
          BUILD_STORYBOOK: 'yes'
        run: ./manage.sh build-bundle

      - name: Prepare directories for zipping
        run: |
          mkdir zips
          mv bundles penpot

      - name: Create zip bundle
        run: |
          echo "📦 Packaging Penpot bundle..."
          zip -r zips/penpot.zip penpot

      - name: Upload Penpot bundle to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          BUILD_KEY: ${{ needs.check.outputs.build_key }}
          BUNDLE_VERSION: ${{ needs.check.outputs.bundle_version }}
        run: |
          aws s3 cp zips/penpot.zip \
            "s3://${S3_BUCKET}/penpot-${BUILD_KEY}.zip" \
            --metadata "bundle-version=${BUNDLE_VERSION}"

      - name: Write step summary
        env:
          SHORT_SHA: ${{ needs.check.outputs.short_sha }}
          BUNDLE_VERSION: ${{ needs.check.outputs.bundle_version }}
          COMMIT_TITLE: ${{ needs.check.outputs.commit_title }}
        run: |
          {
            echo "### ✅ Bundle built"
            echo ""
            echo "- Version: \`${BUNDLE_VERSION}\` (\`./manage.sh version\`)"
            echo "- Commit: [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHORT_SHA}) — ${COMMIT_TITLE}"
            echo "- Built at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Single failure notification for the whole workflow ─────────────
  notify:
    name: Notify failure
    runs-on: penpot-standar-runner
    timeout-minutes: 5
    needs: [check, build]
    if: failure()

    steps:
      - name: Notify Mattermost
        uses: mattermost/action-mattermost-notify@ae31bb6f9e26a54336e79696f108a2c91cf55b4e # v2.1.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK }}
          MATTERMOST_CHANNEL: bot-alerts-cicd
          TEXT: |
            ❌ 📦 *[PENPOT] Error building penpot bundles.*
            📄 Triggered from ref: `${{ needs.check.outputs.gh_ref || inputs.gh_ref }}`
               Bundle version: `${{ needs.check.outputs.bundle_version || 'n/a' }}`
            🔗 Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            @infra
