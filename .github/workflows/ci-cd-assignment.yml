name: "CI/CD: Group Pipeline"

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: "Test: Backend"
    runs-on: ubuntu-latest
    container:
      image: penpotapp/devenv:latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: penpot_test
          POSTGRES_PASSWORD: penpot_test
          POSTGRES_DB: penpot_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format check
        working-directory: ./backend
        run: cljfmt check --parallel=true src/ test/

      - name: Lint
        working-directory: ./backend
        run: clj-kondo --parallel --lint ../common/src/ src/

      - name: Run tests
        working-directory: ./backend
        env:
          PENPOT_TEST_DATABASE_URI: "postgresql://postgres/penpot_test"
          PENPOT_TEST_DATABASE_USERNAME: penpot_test
          PENPOT_TEST_DATABASE_PASSWORD: penpot_test
          PENPOT_TEST_REDIS_URI: "redis://valkey/1"
        run: |
          mkdir -p /tmp/penpot
          clojure -M:dev:test

  test-frontend:
    name: "Test: Frontend"
    runs-on: ubuntu-latest
    container:
      image: penpotapp/devenv:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install

      - name: Lint
        working-directory: ./frontend
        run: |
          pnpm run check-fmt:js
          pnpm run check-fmt:scss
          pnpm run lint:js
          pnpm run lint:scss

      - name: Unit tests
        working-directory: ./frontend
        run: ./scripts/test

  test-exporter:
    name: "Test: Exporter"
    runs-on: ubuntu-latest
    container:
      image: penpotapp/devenv:latest
    # The queue tests need a real redis; without PENPOT_REDIS_URI they skip.
    services:
      redis:
        image: valkey/valkey:8
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ./exporter
        run: pnpm install

      - name: Lint
        working-directory: ./exporter
        run: |
          pnpm run check-fmt:clj
          pnpm run lint:clj

      - name: Tests
        working-directory: ./exporter
        env:
          PENPOT_REDIS_URI: redis://redis/0
        run: ./scripts/test

  # STUB — not implemented yet.
  #
  # The Module 1 architecture diagram proposes a scalable exporter: an
  # export queue/dispatcher in front of a pool of exporter workers, with
  # Valkey holding job state. None of that exists in code yet (exporter/
  # is still a single-process service), so there is nothing real to test.
  #
  # This job is a placeholder that documents the CI/CD plan for when it
  # lands, so the pipeline isn't silent about a known architecture gap.
  # It always succeeds; it does not assert anything about the codebase.
  #
  # Once the dispatcher and worker pool exist, replace this job's steps
  # with:
  #   - Unit tests for the dispatcher's job-distribution logic (does a
  #     submitted export land on exactly one worker, and does it retry
  #     correctly if a worker dies mid-job?).
  #   - An integration test that runs 2+ worker replicas against a real
  #     Valkey service container and confirms jobs are not dropped or
  #     double-processed under concurrent load.
  #   - A check that worker autoscaling config (however it's implemented)
  #     is exercised, not just present in a config file.
  test-scalable-exporter:
    name: "Test: Scalable Exporter (planned)"
    runs-on: ubuntu-latest
    steps:
      - name: Not implemented yet
        run: |
          echo "STUB: the export queue/dispatcher + worker pool from the"
          echo "architecture diagram have no code yet, so there is nothing"
          echo "to build or test here. See the comment above this job in"
          echo ".github/workflows/ci-cd-assignment.yml for the test plan"
          echo "to implement once that component is built."

  build:
    name: "Build artifacts"
    needs: [test-backend, test-frontend, test-exporter]
    # Manual runs build too, so the deploy smoke test can be tried on a
    # branch before it reaches develop.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: penpotapp/devenv:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend jar
        working-directory: ./backend
        run: clojure -T:build jar

      - name: Build frontend bundle
        working-directory: ./frontend
        run: |
          pnpm install
          pnpm run build:wasm
          pnpm run build:app

      # `scripts/build` makes the full bundle the exporter image needs:
      # the app plus package.json, the lockfile, the render-wasm files and
      # the `setup` script the Dockerfile runs.
      # Steps in a container job run under `sh` unless told otherwise; the
      # version string below needs bash.
      - name: Build exporter bundle
        working-directory: ./exporter
        shell: bash
        run: ./scripts/build "${GITHUB_REF_NAME}-${GITHUB_SHA::12}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: penpot-build-${{ github.sha }}
          path: |
            backend/target/*.jar
            frontend/target
            exporter/target
          retention-days: 7

  # Smoke-test deploy of the scalable exporter: builds the exporter image
  # from this run's bundle, then starts the real docker-compose services
  # (Valkey, the `api` exporter and several `worker` replicas) and checks
  # they all come up on the one shared queue and process jobs.
  deploy:
    name: "Deploy (multi-worker smoke test)"
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f docker/images/docker-compose.yaml
      PENPOT_EXPORTER_IMAGE: penpot-exporter:ci
      WORKERS: 3
      JOBS: 6
      KEYS: penpot.exporter.default
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: penpot-build-${{ github.sha }}
          path: artifacts

      # Artifacts drop file modes, so `setup` gets its execute bit back.
      - name: Stage exporter bundle
        run: |
          rm -rf docker/images/bundle-exporter
          cp -r artifacts/exporter/target docker/images/bundle-exporter
          chmod +x docker/images/bundle-exporter/setup

      # The release base (dhi.io) needs a Docker Hub login; a public
      # Debian 13 Node image stands in for it here.
      - name: Build exporter image
        run: |
          docker build \
            -f docker/images/Dockerfile.exporter \
            --build-arg BASE_IMAGE=node:24-trixie \
            -t "$PENPOT_EXPORTER_IMAGE" \
            docker/images

      - name: Start Valkey, the api exporter and the workers
        run: |
          $COMPOSE up -d --wait --wait-timeout 120 \
            --scale penpot-exporter-worker=$WORKERS \
            penpot-valkey penpot-exporter penpot-exporter-worker
          $COMPOSE ps

      - name: Check every exporter registered on the shared queue
        run: |
          vk() { $COMPOSE exec -T penpot-valkey valkey-cli "$@"; }
          expected=$((WORKERS + 1))

          running=$($COMPOSE ps --status running -q penpot-exporter-worker | wc -l)
          echo "running worker containers: $running"
          [ "$running" -eq "$WORKERS" ] || { echo "::error::expected $WORKERS workers, $running running"; exit 1; }

          for _ in $(seq 1 30); do
            n=$(vk scard "$KEYS.instances")
            [ "$n" -ge "$expected" ] && break
            sleep 2
          done
          echo "registered exporters: $n (expected $expected)"
          [ "$n" -ge "$expected" ] || { echo "::error::only $n of $expected exporters registered"; exit 1; }

          workers=0
          for id in $(vk smembers "$KEYS.instances"); do
            role=$(vk get "$KEYS.instance.$id")
            echo "  $id -> ${role:-no heartbeat}"
            [ -n "$role" ] || { echo "::error::exporter $id has no heartbeat"; exit 1; }
            [ "$role" = "worker" ] && workers=$((workers + 1))
          done
          [ "$workers" -eq "$WORKERS" ] || { echo "::error::expected $WORKERS live workers, found $workers"; exit 1; }

      # No backend or browser runs here, so the renders themselves fail.
      # What this checks is that jobs sent to the api reach the workers
      # and each one is claimed and settled.
      - name: Check the workers take jobs from the queue
        run: |
          vk() { $COMPOSE exec -T penpot-valkey valkey-cli "$@"; }
          uuid() { cat /proc/sys/kernel/random/uuid; }
          profile=$(uuid)

          for i in $(seq 1 "$JOBS"); do
            body='["^ ","~:cmd","~:export-shapes","~:profile-id","~u'$profile'","~:wait",false,"~:force-multiple",true,"~:exports",[["^ ","~:page-id","~u'$(uuid)'","~:file-id","~u'$(uuid)'","~:object-id","~u'$(uuid)'","~:type","~:png","~:suffix","","~:scale",1,"~:name","obj'$i'"]]]'
            code=$($COMPOSE exec -T penpot-exporter curl -s -o /dev/null -w '%{http_code}' \
                     -X POST http://localhost:6061/api/export \
                     -H 'content-type: application/transit+json' --data "$body")
            echo "export $i -> HTTP $code"
            [ "$code" = "200" ] || { echo "::error::api answered $code"; exit 1; }
          done

          for _ in $(seq 1 30); do
            settled=0
            for k in $(vk --scan --pattern "$KEYS.job.*"); do
              vk hget "$k" data | grep -Eq '"~:state","(done|failed|ended|error|cancelled)"' && settled=$((settled + 1))
            done
            depth=$(vk llen "$KEYS.queue")
            [ "$settled" -ge "$JOBS" ] && [ "$depth" -eq 0 ] && break
            sleep 2
          done
          echo "settled jobs: $settled of $JOBS, queue depth: $depth"
          [ "$settled" -ge "$JOBS" ] && [ "$depth" -eq 0 ] || { echo "::error::jobs were not processed"; exit 1; }

          echo "jobs per worker:"
          for k in $(vk --scan --pattern "$KEYS.job.*"); do
            vk hget "$k" data | grep -o '"~:owner","[^"]*"' | cut -d'"' -f4
          done | sort | uniq -c

      - name: Exporter logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200 penpot-exporter penpot-exporter-worker

      - name: Stop services
        if: always()
        run: $COMPOSE down
