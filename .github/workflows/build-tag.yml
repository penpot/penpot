name: _TAG

run-name: >-
  _TAG (${{ github.ref_name }} @ ${{ github.sha }})

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and overwrite even if already built/promoted (manual re-releases only)'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - '*'

# Keyed by ref and never cancelling: pushing 2.17.2 shortly after 2.17.2-RC1
# must not abort the release already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-bundle:
    permissions:
      contents: read
    uses: ./.github/workflows/build-bundle.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      MATTERMOST_WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    with:
      gh_ref: ${{ github.ref_name }}
      force: ${{ inputs.force || false }}

  build-docker:
    needs: build-bundle
    permissions:
      contents: read
    uses: ./.github/workflows/build-docker.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      MATTERMOST_WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK }}
      PUB_DOCKER_PASSWORD: ${{ secrets.PUB_DOCKER_PASSWORD }}
      PUB_DOCKER_USERNAME: ${{ secrets.PUB_DOCKER_USERNAME }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    with:
      gh_ref: ${{ github.ref_name }}
      force: ${{ inputs.force || false }}

  build-docker-admin-console:
    permissions: {}
    uses: ./.github/workflows/build-docker-admin-console.yml
    secrets:
      ORG_WORKFLOW_TOKEN: ${{ secrets.ORG_WORKFLOW_TOKEN }}
    with:
      gh_ref: ${{ github.ref_name }}
      force: ${{ inputs.force || false }}

  notify:
    name: Notifications
    permissions: {}
    runs-on: ubuntu-latest
    needs:
      - build-docker
      - build-docker-admin-console
    steps:
      - name: Notify Mattermost
        uses: mattermost/action-mattermost-notify@ae31bb6f9e26a54336e79696f108a2c91cf55b4e # v2.1.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK }}
          MATTERMOST_CHANNEL: bot-alerts-cicd
          TEXT: |
            🐳 *[PENPOT] Docker image available: ${{ github.ref_name }}*
            🔗 Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            @infra

  publish-final-tag:
    if: ${{ !contains(github.ref_name, '-RC') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta')  && contains(github.ref_name, '.') }}
    needs:
      - build-docker
      - build-docker-admin-console
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      MATTERMOST_WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK }}
      PUB_DOCKER_PASSWORD: ${{ secrets.PUB_DOCKER_PASSWORD }}
      PUB_DOCKER_USERNAME: ${{ secrets.PUB_DOCKER_USERNAME }}
    with:
      gh_ref: ${{ github.ref_name }}
