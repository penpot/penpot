name: Docker Images Builder

on:
  workflow_dispatch:
    inputs:
      gh_ref:
        description: 'Name of the branch or ref'
        type: string
        required: true
        default: 'develop'
      force:
        description: 'Rebuild even if this commit was already built'
        type: boolean
        required: false
        default: false

      # preview, platforms, images, attestations and move_branch_tags are
      # deliberately not exposed here. They change what gets built, and the
      # completion marker only records the commit, so a manual run with
      # non-default values would let a later full build skip its work. They
      # are reachable through workflow_call, where each caller fixes them.
  workflow_call:
    inputs:
      gh_ref:
        description: 'Name of the branch or ref'
        type: string
        required: true
      sha:
        description: >-
          Exact commit to build, normally taken from build-bundle so that
          both build the same thing. Falls back to gh_ref when empty; the
          branch tag to move always comes from gh_ref.
        type: string
        required: false
        default: ''
      force:
        description: 'Rebuild even if this commit was already built'
        type: boolean
        required: false
        default: false
      preview:
        description: >-
          When true, the images are pushed to the preview registry instead of
          the usual one.
        type: boolean
        required: false
        default: false
      platforms:
        description: >-
          Architectures to build the images for. Both are needed for anything
          deployed or published; a preview only needs linux/amd64.
        type: string
        required: false
        default: 'linux/amd64,linux/arm64'
      images:
        description: >-
          Which images to build, space separated. Defaults to all of them.
        type: string
        required: false
        default: 'backend frontend exporter storybook mcp'
      attestations:
        description: >-
          When true, an SBOM and provenance data are attached to each image.
          Needed for anything published, and it makes the build slower.
        type: boolean
        required: false
        default: true
      move_branch_tags:
        description: >-
          When true, the branch tag (backend:develop and so on) is repointed
          to this build. Previews leave it alone, so that they never change
          what the fixed environments deploy.
        type: boolean
        required: false
        default: true
    outputs:
      build_key:
        description: 'Tag the images were published under'
        value: ${{ jobs.prepare.outputs.build_key }}
      registry:
        description: 'Registry the images were published to'
        value: ${{ jobs.prepare.outputs.registry }}
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_REGION:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      DOCKER_PASSWORD:
        required: false
      DOCKER_REGISTRY:
        required: false
      DOCKER_USERNAME:
        required: false
      MATTERMOST_WEBHOOK:
        required: false
      PREVIEW_REGISTRY_PASSWORD:
        required: false
      PREVIEW_REGISTRY_URL:
        required: false
      PREVIEW_REGISTRY_USERNAME:
        required: false
      PUB_DOCKER_PASSWORD:
        required: false
      PUB_DOCKER_USERNAME:
        required: false
      S3_BUCKET:
        required: false

# Literal group name: under `workflow_call`, `github.workflow` resolves to the
# caller's workflow, which put this workflow and the other reusable one called
# by the same caller into a single shared group, and left a manual dispatch of
# the same ref in a group of its own, free to race on the same artifacts.
# The mode is part of the group. Without it a preview and a published build
# of the same ref cancel each other, and the one that dies can leave images
# pushed with no marker.
concurrency:
  group: build-docker-${{ inputs.preview && 'preview' || 'published' }}-${{ inputs.gh_ref }}
  cancel-in-progress: true

env:
  ALL_IMAGES: ${{ inputs.images }}
  # All runner instances live on the same server, so the bundle is
  # downloaded from S3 once and shared between build jobs through this
  # host-local directory. Each build job falls back to S3 if the file is
  # missing (e.g. if runners ever move to separate machines).
  BUNDLE_CACHE: /var/tmp/penpot-bundle-cache

permissions:
  contents: read

jobs:
  # ── 1. Resolve the build key and check the whole set at once ───────────
  prepare:
    name: Prepare
    runs-on: penpot-standar-runner
    timeout-minutes: 15
    outputs:
      gh_ref: ${{ steps.vars.outputs.gh_ref }}
      ref_slug: ${{ steps.vars.outputs.ref_slug }}
      bundle_version: ${{ steps.vars.outputs.bundle_version }}
      sha: ${{ steps.vars.outputs.sha }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      build_key: ${{ steps.vars.outputs.build_key }}
      commit_title: ${{ steps.vars.outputs.commit_title }}
      registry: ${{ steps.vars.outputs.registry }}
      marker_key: ${{ steps.vars.outputs.marker_key }}
      images_json: ${{ steps.vars.outputs.images_json }}
      exists: ${{ steps.check.outputs.exists }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.sha != '' && inputs.sha || inputs.gh_ref }}

      - name: Extract some useful variables
        id: vars
        env:
          GH_REF: ${{ inputs.gh_ref || github.ref_name }}
          PREVIEW: ${{ inputs.preview }}
          PREVIEW_REGISTRY: ${{ secrets.PREVIEW_REGISTRY_URL }}
          DEFAULT_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
        run: |
          # A git ref accepts characters that a Docker tag does not.
          REF_SLUG=$(printf '%s' "$GH_REF" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-100)
          echo "gh_ref=$GH_REF" >> $GITHUB_OUTPUT
          echo "ref_slug=$REF_SLUG" >> $GITHUB_OUTPUT
          # Must match the key computed by build-bundle.yml.
          BUNDLE_VERSION=$(./manage.sh version)
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          VERSION_TAG=$(git describe --tags --match '*.*.*' --abbrev=0)
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "commit_title=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
          echo "bundle_version=$BUNDLE_VERSION" >> $GITHUB_OUTPUT
          echo "build_key=sha-${SHORT_SHA}-${VERSION_TAG}" >> $GITHUB_OUTPUT
          # Previews need their own marker. The build key only depends on
          # the commit, so a preview that wrote the normal one would make a
          # later release build of that commit think it had nothing to do.
          if [ "$PREVIEW" = "true" ]; then
            if [ -z "$PREVIEW_REGISTRY" ]; then
              echo "::error::preview=true but PREVIEW_REGISTRY_URL is not set"
              exit 1
            fi
            REGISTRY="$PREVIEW_REGISTRY"
            MARKER_KEY="markers/images-preview-sha-${SHORT_SHA}-${VERSION_TAG}"
          else
            REGISTRY="$DEFAULT_REGISTRY"
            MARKER_KEY="markers/images-sha-${SHORT_SHA}-${VERSION_TAG}"
          fi
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "marker_key=$MARKER_KEY" >> $GITHUB_OUTPUT
          # Validated here so that a bad value fails with a clear message
          # instead of producing an empty matrix or a Dockerfile name that
          # does not exist.
          KNOWN="backend frontend exporter storybook mcp"
          for img in $ALL_IMAGES; do
            case " $KNOWN " in
              *" $img "*) ;;
              *) echo "::error::unknown image '$img'; expected one of: $KNOWN"
                 exit 1 ;;
            esac
          done
          if [ -z "$ALL_IMAGES" ]; then
            echo "::error::images is empty"
            exit 1
          fi
          # Actions expressions have no split(), so the matrix gets its JSON
          # from here and the input stays a readable space-separated list.
          echo "images_json=[$(printf '\"%s\",' $ALL_IMAGES | sed 's/,$//')]" >> $GITHUB_OUTPUT

      # The image set is a single block, so a single set-level check is
      # enough: `promote` drops a marker object in S3 only after every
      # image was built AND every branch tag was moved. Marker present
      # means there is nothing at all to do for this commit. `force`
      # bypasses this check entirely.
      - name: Check if this image set is already built
        id: check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          FORCE: ${{ inputs.force }}
          BUILD_KEY: ${{ steps.vars.outputs.build_key }}
          MARKER_KEY: ${{ steps.vars.outputs.marker_key }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            mkdir -p "$BUNDLE_CACHE"
            find "$BUNDLE_CACHE" -type f -mtime +1 -delete || true
            ZIP="$BUNDLE_CACHE/penpot-${BUILD_KEY}.zip"
            aws s3 cp "s3://${S3_BUCKET}/penpot-${BUILD_KEY}.zip" "$ZIP.$$.tmp"
            mv "$ZIP.$$.tmp" "$ZIP"
            {
              echo "### 🔁 Image set build forced"
              echo ""
              echo "\`force: true\` — skipping the S3 marker check."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if aws s3api head-object \
               --bucket "$S3_BUCKET" \
               --key "$MARKER_KEY" \
               > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            {
              echo "### ⏭️ Image set build skipped"
              echo ""
              echo "The whole set was already built and promoted for \`${BUILD_KEY}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> $GITHUB_OUTPUT

            # Stage the bundle in the host-local cache, once, for all the
            # build jobs. Download to a temp name and mv for atomicity;
            # prune stale bundles while at it.
            mkdir -p "$BUNDLE_CACHE"
            find "$BUNDLE_CACHE" -type f -mtime +1 -delete || true
            ZIP="$BUNDLE_CACHE/penpot-${BUILD_KEY}.zip"
            if [ ! -f "$ZIP" ]; then
              aws s3 cp "s3://${S3_BUCKET}/penpot-${BUILD_KEY}.zip" "$ZIP.$$.tmp"
              mv "$ZIP.$$.tmp" "$ZIP"
            fi
          fi

  # ── 2. One build per image, in parallel, only when needed ──────────────
  build:
    name: Build ${{ matrix.image }}
    runs-on: penpot-standar-runner
    timeout-minutes: 60
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    strategy:
      fail-fast: true
      # 4 runner slots are available for build jobs on this server; cap the
      # matrix at 3 so short jobs (prepare and other workflows' checks)
      # never queue behind long builds.
      max-parallel: 3
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images_json) }}

    steps:
      - name: Set common environment variables
        # The matrix is now built from an input, so the image name reaches
        # the shell through the environment rather than being expanded into
        # the script.
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          # Each job execution will use its own docker configuration.
          echo "DOCKER_CONFIG=${{ runner.temp }}/.docker-${{ github.run_id }}-${{ github.job }}-${IMAGE}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha != '' && inputs.sha || inputs.gh_ref }}

      - name: Login to Docker Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.preview && secrets.PREVIEW_REGISTRY_URL || secrets.DOCKER_REGISTRY }}
          username: ${{ inputs.preview && secrets.PREVIEW_REGISTRY_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ inputs.preview && secrets.PREVIEW_REGISTRY_PASSWORD || secrets.DOCKER_PASSWORD }}

      # To avoid the "429 Too Many Requests" error when downloading
      # images from DockerHub for unregistered users.
      # https://docs.docker.com/docker-hub/usage/
      - name: Login to DockerHub Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.PUB_DOCKER_USERNAME }}
          password: ${{ secrets.PUB_DOCKER_PASSWORD }}

      # Images now build FROM Docker Hardened Images (dhi.io). DHI
      # is free (Apache 2.0, no subscription), but pulling from it
      # still requires an authenticated login -- a separate `docker
      # login` against a different registry host, even though it
      # reuses the same PUB_DOCKER_* credentials as the DockerHub
      # login above.
      - name: Login to Docker Hardened Images registry (base image pull)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.PUB_DOCKER_USERNAME }}
          password: ${{ secrets.PUB_DOCKER_PASSWORD }}

      # Bundle staged once by `prepare` on this host; the S3 fallback only
      # triggers if the cache is unavailable (runners on another machine,
      # cache pruned mid-run, ...).
      - name: Prepare Penpot bundle
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          BUILD_KEY: ${{ needs.prepare.outputs.build_key }}
          IMAGE: ${{ matrix.image }}
        run: |
          ZIP="$BUNDLE_CACHE/penpot-${BUILD_KEY}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Bundle not found in host cache; falling back to S3."
            mkdir -p "$BUNDLE_CACHE"
            aws s3 cp "s3://${S3_BUCKET}/penpot-${BUILD_KEY}.zip" "$ZIP.$$.tmp"
            mv "$ZIP.$$.tmp" "$ZIP"
          fi
          # Extract only the bundle this job needs.
          pushd docker/images
          unzip -q "$ZIP" "penpot/${IMAGE}/*"
          mv "penpot/${IMAGE}" "bundle-${IMAGE}"
          popd

      # Only needed to build for a foreign architecture. It registers
      # binfmt for the whole host, which the other runners on this machine
      # share, so it is skipped when nothing has to be emulated.
      - name: Set up QEMU (stable)
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          labels: |
            bundle_version=${{ needs.prepare.outputs.bundle_version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/images/
          file: ./docker/images/Dockerfile.${{ matrix.image }}
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: ${{ inputs.attestations && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attestations }}
          # Immutable tag only; branch tags are moved atomically for the
          # whole image set by the `promote` job.
          tags: ${{ needs.prepare.outputs.registry }}/${{ matrix.image }}:${{ needs.prepare.outputs.build_key }}
          labels: ${{ steps.meta.outputs.labels }}
          # One cache per registry, so a single-arch preview build cannot
          # overwrite the cache a multi-arch release build needs.
          cache-from: type=registry,ref=${{ needs.prepare.outputs.registry }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.registry }}/${{ matrix.image }}:buildcache,mode=max

  # ── 3a. Move the branch tags of ALL images together (fresh build) ──────
  promote:
    name: Promote image set
    runs-on: penpot-standar-runner
    timeout-minutes: 10
    needs: [prepare, build]

    steps:
      - name: Set common environment variables
        run: |
          echo "DOCKER_CONFIG=${{ runner.temp }}/.docker-${{ github.run_id }}-${{ github.job }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.preview && secrets.PREVIEW_REGISTRY_URL || secrets.DOCKER_REGISTRY }}
          username: ${{ inputs.preview && secrets.PREVIEW_REGISTRY_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ inputs.preview && secrets.PREVIEW_REGISTRY_PASSWORD || secrets.DOCKER_PASSWORD }}

      # Skipped for previews: these are the tags the fixed environments
      # deploy from.
      - name: Point branch tags to the new build key
        if: inputs.move_branch_tags
        env:
          DOCKER_REGISTRY: ${{ needs.prepare.outputs.registry }}
          REF_SLUG: ${{ needs.prepare.outputs.ref_slug }}
          BUILD_KEY: ${{ needs.prepare.outputs.build_key }}
        run: |
          set -e
          for image in $ALL_IMAGES; do
            docker buildx imagetools create \
              -t "${DOCKER_REGISTRY}/${image}:${REF_SLUG}" \
              "${DOCKER_REGISTRY}/${image}:${BUILD_KEY}"
          done

      # The marker is written LAST: its presence certifies that all five
      # images exist and all branch tags point to this build key.
      - name: Write set-completed marker
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          MARKER_KEY: ${{ needs.prepare.outputs.marker_key }}
        run: |
          echo "$GITHUB_RUN_ID" | aws s3 cp - \
            "s3://${S3_BUCKET}/${MARKER_KEY}"

      - name: Write step summary
        env:
          REF_SLUG: ${{ needs.prepare.outputs.ref_slug }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          BUILD_KEY: ${{ needs.prepare.outputs.build_key }}
          BUNDLE_VERSION: ${{ needs.prepare.outputs.bundle_version }}
          COMMIT_TITLE: ${{ needs.prepare.outputs.commit_title }}
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          MOVE_BRANCH_TAGS: ${{ inputs.move_branch_tags }}
        run: |
          {
            echo "### ✅ Image set promoted"
            echo ""
            echo "- Version: \`${BUNDLE_VERSION}\` (\`./manage.sh version\`)"
            echo "- Commit: [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHORT_SHA}) — ${COMMIT_TITLE}"
            echo "- Registry: \`${REGISTRY}\`"
            echo "- Built at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            if [ "$MOVE_BRANCH_TAGS" = "true" ]; then
              echo "All \`:${REF_SLUG}\` tags now point to \`${BUILD_KEY}\`."
            else
              echo "Branch tags were left untouched; deploy \`${BUILD_KEY}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3b. Skip path: make sure THIS ref's tags point to the existing
  # images (another ref may have built and promoted the same commit
  # first — the sha marker says the images exist, not that this ref's
  # tags were ever created).
  retag:
    name: Ensure branch tags (already-built commit)
    runs-on: penpot-standar-runner
    timeout-minutes: 10
    needs: prepare
    # Nothing to ensure when the branch tags are not being moved, and running
    # it anyway would log in for nothing and claim tags were repointed.
    if: needs.prepare.outputs.exists == 'true' && inputs.move_branch_tags

    steps:
      - name: Set common environment variables
        run: |
          echo "DOCKER_CONFIG=${{ runner.temp }}/.docker-${{ github.run_id }}-${{ github.job }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.preview && secrets.PREVIEW_REGISTRY_URL || secrets.DOCKER_REGISTRY }}
          username: ${{ inputs.preview && secrets.PREVIEW_REGISTRY_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ inputs.preview && secrets.PREVIEW_REGISTRY_PASSWORD || secrets.DOCKER_PASSWORD }}

      - name: Point branch tags to the existing build key
        if: inputs.move_branch_tags
        env:
          DOCKER_REGISTRY: ${{ needs.prepare.outputs.registry }}
          REF_SLUG: ${{ needs.prepare.outputs.ref_slug }}
          BUILD_KEY: ${{ needs.prepare.outputs.build_key }}
        run: |
          set -e
          for image in $ALL_IMAGES; do
            docker buildx imagetools create \
              -t "${DOCKER_REGISTRY}/${image}:${REF_SLUG}" \
              "${DOCKER_REGISTRY}/${image}:${BUILD_KEY}"
          done

      - name: Write step summary
        env:
          REF_SLUG: ${{ needs.prepare.outputs.ref_slug }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          BUILD_KEY: ${{ needs.prepare.outputs.build_key }}
          BUNDLE_VERSION: ${{ needs.prepare.outputs.bundle_version }}
          COMMIT_TITLE: ${{ needs.prepare.outputs.commit_title }}
        run: |
          {
            echo "### ✅ Image set already built (branch tags ensured)"
            echo ""
            echo "- Version: \`${BUNDLE_VERSION}\` (\`./manage.sh version\`)"
            echo "- Commit: [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHORT_SHA}) — ${COMMIT_TITLE}"
            echo "- Checked at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "All \`:${REF_SLUG}\` tags now point to \`${BUILD_KEY}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 4. Single failure notification for the whole workflow ─────────────
  notify:
    name: Notify failure
    runs-on: penpot-standar-runner
    timeout-minutes: 5
    needs: [prepare, build, promote, retag]
    if: failure()

    steps:
      - name: Notify Mattermost
        uses: mattermost/action-mattermost-notify@ae31bb6f9e26a54336e79696f108a2c91cf55b4e # v2.1.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK }}
          MATTERMOST_CHANNEL: bot-alerts-cicd
          TEXT: |
            ❌ 🐳 *[PENPOT] Error building/promoting the penpot docker image set.*
            📄 Triggered from ref: `${{ needs.prepare.outputs.gh_ref || inputs.gh_ref }}`
            📦 Bundle: `${{ needs.prepare.outputs.bundle_version || 'n/a' }}`
            🔗 Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            @infra
