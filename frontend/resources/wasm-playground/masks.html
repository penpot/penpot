<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renderer playground: masks</title>
    <style>
      body {
        margin: 0;
        background: #111;
        overflow: hidden;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
      #error {
        position: fixed;
        background: white;
        color: #900;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script type="module">
      import initModule from "/js/render-wasm.js";
      import scenario from "./scenes/masks.js";
      import { mountScenario } from "./js/lib.js";

      mountScenario(
        scenario,
        initModule,
        document.getElementById("canvas"),
      ).catch((error) => {
        console.error(error);
        const message = document.createElement("pre");
        message.id = "error";
        message.textContent = error.message;
        document.body.append(message);
      });
    </script>
  </body>
</html>
